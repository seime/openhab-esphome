name: Build and create release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_oh4:
    strategy:
      fail-fast: false
      matrix:
        java: [ '17' ]
        os: [ ubuntu-latest ]

    name: Build OH4 (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ESPHome
        run: pip install esphome

      - name: Build
        run: >
          mvn -P standalone
          --batch-mode
          -DskipChecks
          -Doh.java.version=17
          clean verify

      - name: Upload OH4 JARs
        uses: actions/upload-artifact@v7
        with:
          name: oh4-artifact
          path: target/*.jar

  release_oh4:
    needs: build_oh4
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: write

    steps:
      - name: Download OH4 JARs
        uses: actions/download-artifact@v8
        with:
          name: oh4-artifact
          path: target

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_oh4
          name: Latest Build
          prerelease: true
          files: target/*.jar